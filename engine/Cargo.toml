[package]
name = "agent-engine"
version = "0.1.0"
edition = "2021"
description = "Local LLM inference engine (llama.cpp via Rust FFI) for the AI coding agent"

[dependencies]
llama-cpp-2 = { version = "=0.1.160", features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
