org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=false
# 로컬에 설치된 IntelliJ 로 빌드 (IDE 다운로드 생략). 다른 경로면: ./gradlew buildPlugin -PlocalIdePath=/Applications/IntelliJ\ IDEA.app
localIdePath=/Applications/IntelliJ IDEA CE.app

# IDE 의 Gradle 데몬과 동시에 빌드하면 증분 캐시가 깨지는 일이 있어 끔 (프로젝트가 작아 영향 적음)
kotlin.incremental=false

# Android Studio 용 빌드 (-PtargetIde=android)
androidStudioPath=/Applications/Android Studio.app
